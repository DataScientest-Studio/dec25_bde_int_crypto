name: ml_pipeline

networks:
  ml_net:
    driver: bridge

volumes:
  mongodb_ml_data:
  collector_data:
  model_artifacts:

services:

  mongodb-ml:
    image: mongo:8.0
    container_name: mongodb-ml
    restart: unless-stopped
    networks:
      - ml_net
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27018:27017"
    volumes:
      - mongodb_ml_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express-ml:
    image: mongo-express:1.0.2
    container_name: mongo-express-ml
    restart: unless-stopped
    depends_on:
      - mongodb-ml
    networks:
      - ml_net
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-ml
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8083:8081"

  binance-collector:
    build:
      context: ..
      dockerfile: ml-pipeline/dockerfiles/Dockerfile.collector
    container_name: binance-collector
    restart: "no"
    depends_on:
      mongodb-ml:
        condition: service_healthy
    networks:
      - ml_net
    env_file:
      - .env
    volumes:
      - collector_data:/app/data

  model-trainer:
    build:
      context: ..
      dockerfile: ml-pipeline/dockerfiles/Dockerfile.trainer
    container_name: model-trainer
    restart: "no"
    depends_on:
      mongodb-ml:
        condition: service_healthy
    networks:
      - ml_net
    env_file:
      - .env
    environment:
      MODEL_DIR: /app/models
    volumes:
      - model_artifacts:/app/models

  prediction-api:
    build:
      context: ..
      dockerfile: ml-pipeline/dockerfiles/Dockerfile.api
    container_name: prediction-api
    restart: unless-stopped
    depends_on:
      mongodb-ml:
        condition: service_healthy
    networks:
      - ml_net
    env_file:
      - .env
    environment:
      MODEL_PATH: /app/models/logistic_regression_model.pkl
      SCALER_PATH: /app/models/logistic_regression_scaler.pkl
    ports:
      - "8001:8000"
    volumes:
      - model_artifacts:/app/models
