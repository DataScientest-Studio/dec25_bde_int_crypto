name: dec25_bde_int_crypto

# Reuse the same log rotation policy across services.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

networks:
  # Keep all containers on one internal app network.
  app_network:
    driver: bridge

volumes:
  # Persist MongoDB data between container restarts.
  mongodb_data:
  # Persist Grafana dashboards, plugins, and local state.
  grafana_data:
  # Reserved for collector data if a named volume is needed later.
  collector_data:
  # Share trained model artifacts between trainer and prediction API.
  model_artifacts:
  # Persist Redpanda broker data.
  redpanda-0:

services:
  # Redpanda provides the local streaming backbone.
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.6
    container_name: redpanda-0
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda-0:33145
      - --advertise-rpc-addr
      - redpanda-0:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=warn
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - app_network
    ports:
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "19092:19092"   # Kafka API
      - "19644:9644"    # Admin API
    logging: *default-logging

  # Redpanda Console gives a web UI for topics and messages.
  console:
    image: docker.redpanda.com/redpandadata/console:v3.5.0
    container_name: redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda-0
    networks:
      - app_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "8080:8080"
    logging: *default-logging

  # MongoDB stores both historical and streaming market data.
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    networks:
      - app_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--host", "localhost", "--eval", "db.adminCommand('ping')", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mongodb_data:/data/db
    logging: *default-logging

  # Mongo Express is a lightweight browser UI for MongoDB.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - "8082:8081"
    logging: *default-logging

####################
### OUR SERVICES ###
####################

  # Main FastAPI app for root, prediction, and Grafana routes.
  main:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.main
    container_name: main
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override the Mongo host so containers use the internal service name.
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
    healthcheck:
      # Wait until FastAPI is serving HTTP before dependent services start.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/', timeout=5).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # Grafana visualizes data through the FastAPI Grafana routes.
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      main:
        condition: service_healthy
    networks:
      - app_network
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: warn
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    logging: *default-logging

  # Collector fetches historical Binance candles and updates files plus MongoDB.
  binance-collector:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.collector
    container_name: binance-collector
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Containers talk to MongoDB over the internal Compose network.
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
    volumes:
      # Bind mount local data so raw and processed files stay on the host.
      - ./data:/app/data
    logging: *default-logging

  # Stream producer relays Binance WebSocket candles into Redpanda.
  stream-producer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.stream
    container_name: stream-producer
    restart: unless-stopped
    depends_on:
      - redpanda-0
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Containers must use Redpanda's internal broker address.
      KAFKA_BROKER: redpanda-0:9092
    command: ["python", "-m", "src.service.stream.producer"]
    logging: *default-logging

  # Stream consumer persists Redpanda messages into MongoDB.
  stream-consumer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.stream
    container_name: stream-consumer
    restart: unless-stopped
    depends_on:
      redpanda-0:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Keep broker and Mongo targets on the internal Compose network.
      KAFKA_BROKER: redpanda-0:9092
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
    command: ["python", "-m", "src.service.stream.consumer"]
    logging: *default-logging

  # Trainer reads historical Mongo data and writes model artifacts once per run.
  model-trainer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.trainer
    container_name: model-trainer
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Containers talk to MongoDB over the internal Compose network.
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
      # Save artifacts into the shared models volume.
      MODEL_DIR: /app/models
    volumes:
      - model_artifacts:/app/models
    logging: *default-logging

  # Prediction API serves inference using the shared trained artifacts.
  prediction-api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.prediction-api
    container_name: prediction-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Containers talk to MongoDB over the internal Compose network.
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
      # Point inference to the shared model files written by the trainer.
      MODEL_PATH: /app/models/logistic_regression_model.pkl
      SCALER_PATH: /app/models/logistic_regression_scaler.pkl
    ports:
      - "8001:8000"
    volumes:
      - model_artifacts:/app/models
    logging: *default-logging
