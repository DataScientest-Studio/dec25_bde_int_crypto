name: dec25_bde_int_crypto

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
  grafana_data:
  collector_data:
  model_artifacts:
  redpanda-0:

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.6
    container_name: redpanda-0
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda-0:33145
      - --advertise-rpc-addr
      - redpanda-0:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=warn
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - app_network
    ports:
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "19092:19092"   # Kafka API
      - "19644:9644"    # Admin API
    logging: *default-logging

  console:
    image: docker.redpanda.com/redpandadata/console:v3.5.0
    container_name: redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda-0
    networks:
      - app_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "8080:8080"
    logging: *default-logging

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    networks:
      - app_network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--host", "localhost", "--eval", "db.adminCommand('ping')", "-u", "admin", "-p", "password", "--authenticationDatabase", "admin" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - mongodb_data:/data/db
    logging: *default-logging

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - "8082:8081"
    logging: *default-logging

####################
### OUR SERVICES ###
####################

  main:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.main
    container_name: main
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/?authSource=admin
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      main:
        condition: service_started
    networks:
      - app_network
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_LEVEL: warn
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    logging: *default-logging

  binance-collector:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.collector
    container_name: binance-collector
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging: *default-logging

  model-trainer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.trainer
    container_name: model-trainer
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      MODEL_DIR: /app/models
    volumes:
      - model_artifacts:/app/models
    logging: *default-logging

  prediction-api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.prediction-api
    container_name: prediction-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    env_file:
      - .env
    environment:
      MODEL_PATH: /app/models/logistic_regression_model.pkl
      SCALER_PATH: /app/models/logistic_regression_scaler.pkl
    ports:
      - "8001:8000"
    volumes:
      - model_artifacts:/app/models
    logging: *default-logging
