name: Release Pipeline

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        uv pip install --system -r <(uv pip compile pyproject.toml)
        uv pip install --system pytest pytest-asyncio pytest-cov 'testcontainers[mongodb]'

    - name: Run ruff linting
      run: |
        ruff check .

    - name: Run ruff format check
      run: |
        ruff format --check .

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY

    - name: Build Docker images
      run: |
        docker build -f dockerfiles/Dockerfile.main -t crypto-data-api-main:${{ github.sha }} .
        docker build -f dockerfiles/Dockerfile.collector -t crypto-data-api-collector:${{ github.sha }} .
        docker build -f dockerfiles/Dockerfile.trainer -t crypto-data-api-trainer:${{ github.sha }} .
        docker build -f dockerfiles/Dockerfile.prediction-api -t crypto-data-api-prediction-api:${{ github.sha }} .
        docker build -f dockerfiles/Dockerfile.stream -t crypto-data-api-stream:${{ github.sha }} .
        docker build -f dockerfiles/Dockerfile.dashboard -t crypto-data-api-dashbaord:${{ github.sha }} .
